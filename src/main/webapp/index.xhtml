<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <h:outputStylesheet name="css/default.css"/>
        <h:outputStylesheet name="css/cssLayout.css"/>
        <title>BookFlow</title>
    </h:head>

    <h:body>

        <div id="top">
            <ui:insert name="top">
                <h:form id="formGrowl">
                    <p:growl id="growl" globalOnly="false" showDetail="true"/>
                    <p:menubar>
                        <p:menuitem value="Home" outcome="/index"/>
                        <p:submenu label="Book">
                            <p:menuitem value="Book" outcome="/book/books"/>
                        </p:submenu>
                        <p:submenu label="Admin">
                            <p:menuitem value="Admin" outcome="/admin/book"/>
                        </p:submenu>
                        <f:facet name="end">
                            <h:outputText value="#{loginBean.usuarioLogado.name.concat(' ').concat(loginBean.usuarioLogado.role)}"
                                          style="color: red"/>
                            <p:commandButton value="Logout" action="#{loginBean.logout()}" update="@form"/>
                        </f:facet>
                    </p:menubar>
                </h:form>
            </ui:insert>
        </div>

        <div id="content" class="center_content">
            <ui:insert name="content">Content</ui:insert>
        </div>

        <div id="bottom">
            <ui:insert name="bottom">Bottom</ui:insert>
        </div>

    </h:body>

</html>
